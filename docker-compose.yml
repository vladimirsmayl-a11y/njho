# Локальная PostgreSQL для разработки: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lvs
    ports:
      - "5432:5432"
    volumes:
      - lvs_db:/var/lib/postgresql/data
volumes:
  lvs_db:
